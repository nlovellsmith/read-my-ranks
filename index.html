<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gideon’s Mind Reading Game</title>
<meta name="description" content="A party game: read your friend’s mind and guess how they rank five things.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Unbounded:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one narrow column of "cards" like a stack of index cards on a game table; rank numbers are the visual hero. */
:root{
  --paper:#f1eefb; --card:#ffffff; --ink:#1d1838; --muted:#6b6590; --line:#dcd6f2;
  --accent:#ff4f6d; --accent-ink:#ffffff; --hot:#e0303f; --cold:#2f5fd8; --m1:#8b5cf6; --m2:#22c7b8; --m3:#ec4fb3; --m4:#f5b62a; --gold:#ffb627; --ok:#13a36b; --soft:#ece7ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141127; --card:#1e1a38; --ink:#f1eefb; --muted:#a49ecb; --line:#332d58;
  --accent:#ff6b85; --accent-ink:#1b0f16; --gold:#ffc24d; --ok:#3fd394; --soft:#29234b; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font:800 clamp(13px,4vw,18px)/1 var(--display);white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo .stack{display:inline-grid;gap:2px}
.logo .stack i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.logo .stack i:nth-child(1){width:18px}.logo .stack i:nth-child(2){width:13px;opacity:.7}.logo .stack i:nth-child(3){width:8px;opacity:.45}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.off{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;font-weight:800}
h2{font-size:20px;line-height:1.15;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
label{font-weight:700;font-size:14px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 160px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:46px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent}
button.link{border:0;background:none;padding:4px 2px;min-height:0;color:var(--muted);text-decoration:underline;font-weight:500}
button.full{width:100%}
.code{font:800 34px/1 var(--display);letter-spacing:.14em}
.share{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.qr{width:112px;height:112px;background:#fff;border-radius:10px;padding:6px}
.qr svg,.qr img{width:100%;height:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--soft);font-weight:500;font-size:14px}
.chip.done{background:color-mix(in srgb,var(--ok) 18%,var(--card));}
.chip.wait{opacity:.75}
.chip .x{border:0;background:none;padding:0 2px;min-height:0;color:var(--muted);font-size:16px;line-height:1}
.items{display:flex;flex-direction:column;gap:8px}
.item-in{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.n{font:800 15px/1 var(--display);color:var(--muted);text-align:center}
.pick{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;border-radius:14px;border:1.5px dashed var(--line);padding:8px 10px;min-height:54px;text-align:left;width:100%;background:transparent;font-weight:500}
.slot.filled{border-style:solid;background:var(--soft)}
.slot .rk{font:800 22px/1 var(--display);color:var(--accent);text-align:center}
.slot .t{overflow-wrap:anywhere}
.slot .act{font-size:12px;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{font-weight:500;text-align:left;border-radius:12px;background:var(--card);overflow-wrap:anywhere;max-width:100%}
.pool button:active{transform:scale(.98)}
.drawn{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.drawn li{padding:10px 12px;background:var(--soft);border-radius:12px;font-weight:500;overflow-wrap:anywhere}
.reveal-grid{display:flex;flex-direction:column;gap:10px}
.rl{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.rl li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--soft);font-size:15px}
.rl li .t{overflow-wrap:anywhere;min-width:0}
.rl li.hit{background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.rl li .rk{font:800 15px/1 var(--display);color:var(--accent);text-align:center}
.mark{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.miss{font-size:12px;color:var(--muted);white-space:nowrap}
.ans .rl li{background:color-mix(in srgb,var(--gold) 26%,var(--card))}
.ans .rl li .rk{color:var(--ink)}
.rl.heat li{color:#fff;box-shadow:inset 0 0 0 0 transparent}
.rl.heat li .rk,.ans .rl.heat li .rk{color:#fff;opacity:.9}
.rl.heat li .miss{color:#fff;opacity:.85}
.rl.heat li .mark{color:#fff;background:rgba(0,0,0,.28);padding:3px 7px;border-radius:999px}
.rl.heat li.hit{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--ok)}
.guess-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pts{font:800 18px/1 var(--display)}
.stats{font-size:13px;color:var(--muted)}
table.sb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sb th{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.sb th:first-child,table.sb td:first-child{text-align:left}
table.sb td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.sb td.lead{font:800 16px/1 var(--display);color:var(--accent)}
table.sb td.lead::before{content:"★ ";font-size:12px}
table.sb tr.me td{font-weight:700}
.banner{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 28%,var(--card));font-size:14px}
.err{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:5;max-width:calc(100% - 32px)}


details.eli5{border-top:1px solid var(--line);padding-top:10px}
details.eli5 summary{font-size:14px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
details.eli5 summary::-webkit-details-marker{display:none}
details.eli5 summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 12px/1 var(--display)}
.eli5 .body{display:flex;flex-direction:column;gap:10px;margin-top:10px;font-size:14px}
.eli5 .ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eli5 .ex div{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.eli5 .ex b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.eli5 .box{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--gold) 18%,var(--card));display:flex;flex-direction:column;gap:4px}
.eli5 .box h4{margin:0;font:700 14px/1.2 var(--display)}
.eli5 .math{font-variant-numeric:tabular-nums;font-weight:700}
.card>details.eli5:first-child{border-top:0;padding-top:0}
.card.mine{border:2px solid color-mix(in srgb,#8b5cf6 55%,var(--line));background:color-mix(in srgb,#8b5cf6 7%,var(--card))}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.facts li{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0;padding-bottom:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .card{gap:10px;justify-content:space-between}
.split .card>button{margin-top:auto}
#joincode::placeholder{opacity:.45}
#joincode{text-transform:uppercase;text-align:center;font:800 22px/1 var(--display);letter-spacing:.2em;padding:10px}
button.join{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:340px){.split{grid-template-columns:1fr}}
.waiting{display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#8b5cf6 9%,var(--card));border:1px dashed color-mix(in srgb,#8b5cf6 40%,var(--line))}
.waiting .wt{min-width:0;display:flex;flex-direction:column;gap:2px}
.vision{font-style:italic;color:var(--muted);min-height:2.9em}
.vision.in{animation:vin .6s ease-out}
@keyframes vin{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.orb.sm{width:52px;height:52px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.note span{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid currentColor;font:700 11px/1 var(--body);font-style:italic}
.fill{display:flex;flex-direction:column;gap:6px}
.fillbtns{display:flex;flex-wrap:wrap;gap:6px}
.fillbtns button{min-height:36px;padding:6px 12px;border-radius:999px;font-size:13px;background:var(--soft);border-color:transparent}
select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.marquee{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:6px 0 4px;--m1:#8b5cf6;--m2:#22c7b8;--m3:#ec4fb3;--m4:#f5b62a}
.marquee .title{margin:0;font:400 clamp(46px,15vw,92px)/.95 "Shrikhand",var(--display);letter-spacing:.005em}
.marquee .title .w{display:block;white-space:nowrap}
.marquee .title .w.sm{font-size:.42em;letter-spacing:.06em;margin-bottom:.1em}
.marquee .l{display:inline-block;color:var(--m1);text-shadow:0 0 .35em color-mix(in srgb,currentColor 55%,transparent);animation:drop .9s cubic-bezier(.2,1.3,.45,1) both,glow 4.5s ease-in-out infinite,float 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * 55ms),calc(var(--i) * -160ms),calc(var(--i) * -180ms)}
.marquee .seance{display:flex;align-items:center;gap:14px}
.orb{position:relative;width:78px;height:78px;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 17%),radial-gradient(circle at 50% 60%,#d8c8ff,var(--m1) 52%,#2a0f5c);box-shadow:0 0 26px color-mix(in srgb,var(--m1) 60%,transparent),inset 0 -10px 18px rgba(0,0,0,.35);animation:pulse 3.2s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,transparent 0 15%,color-mix(in srgb,var(--m3) 60%,transparent) 25%,transparent 40% 55%,color-mix(in srgb,var(--m2) 60%,transparent) 68%,transparent 80%);filter:blur(7px);animation:spin 7s linear infinite}
.orb::after{content:"";position:absolute;left:22%;top:16%;width:22%;height:14%;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(1px)}
.orb-wrap{display:flex;flex-direction:column;align-items:center}
.orb-wrap i{display:block;width:58px;height:14px;margin-top:-4px;border-radius:6px 6px 14px 14px;background:linear-gradient(var(--m4),#9a6b12)}
.seance p{font-style:italic;color:var(--muted);max-width:22ch}
.seance p span{display:inline-block;animation:ellipsis 1.6s steps(4,end) infinite;overflow:hidden;vertical-align:bottom;width:1.2em}
@keyframes drop{from{transform:translateY(-.6em) scale(.6);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
@keyframes glow{0%,100%{color:var(--m1)}25%{color:var(--m3)}50%{color:var(--m4)}75%{color:var(--m2)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -.06em}}
@keyframes pulse{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--m1) 45%,transparent),inset 0 -10px 18px rgba(0,0,0,.35)}50%{box-shadow:0 0 38px color-mix(in srgb,var(--m3) 70%,transparent),inset 0 -10px 18px rgba(0,0,0,.35)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ellipsis{from{width:0}to{width:1.2em}}
@media (prefers-reduced-motion:reduce){.marquee .l,.orb,.orb::before,.seance p span{animation:none}}
.hero-ranks{display:flex;gap:6px;align-items:flex-end}
.hero-ranks span{display:grid;place-items:center;font:800 18px/1 var(--display);color:var(--accent-ink);background:var(--accent);border-radius:10px;width:40px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:no-preference){.slot.filled{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}
</style>

<script>
(() => {
"use strict";
// ---------- config ----------
const qs = new URLSearchParams(location.search);
const BROKER = qs.get("broker") || "wss://broker.hivemq.com:8884/mqtt";
const NS = "readmyranks/v1/";
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const CODE_LETTERS = "ABCDEFGHJKMNPQRSTUVWXYZ"; // no I, L, O: easy to read aloud and type

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join("");
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

// Scoring: exact spots, and Kendall-style pair agreement.
function scoreGuess(guess, answer) {
  const n = answer.length; let exact = 0, agree = 0, total = 0;
  const pg = {}, pa = {};
  guess.forEach((id, i) => pg[id] = i); answer.forEach((id, i) => pa[id] = i);
  for (let i = 0; i < n; i++) if (guess[i] === answer[i]) exact++;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = answer[i], b = answer[j]; total++;
    if ((pg[a] < pg[b]) === (pa[a] < pa[b])) agree++;
  }
  const tau = total ? (2 * agree - total) / total : 0;
  let d2 = 0; answer.forEach((id, i) => { const d = pg[id] - i; d2 += d * d; });
  const rho = n > 1 ? 1 - (6 * d2) / (n * (n * n - 1)) : 0;
  return { exact, agree, total, tau, rho };
}
window.__scoreGuess = scoreGuess;

// ---------- built-in categories (for fill buttons and category games) ----------

function eli5() {

// Fun end-of-game insights, each one short line. Values from players are escaped.
function insights() {

  if (!H.length) return [];
  const out = []; const b = t => `<b>${esc(t)}</b>`; const q = t => `“${esc(t)}”`;

  const pred = H.map(h => { const v = Object.values(h.results); return { sel: h.selector, avg: v.reduce((a, x) => a + x.rho, 0) / v.length }; }).sort((a, b) => b.avg - a.avg);
  out.push(["Easiest to read", `${b(name(pred[0].sel))}: mind readers averaged rho ${fmtTau(pred[0].avg)} on their turn.`]);
  if (pred.length > 1) { const w = pred[pred.length - 1]; out.push(["Hardest to read", `${b(name(w.sel))}: mind readers averaged rho ${fmtTau(w.avg)}. A true mystery.`]); }

  if (reads.length > 1 && worst.r.rho < best.r.rho) out.push(["Most upside-down reading", `${b(name(worst.g))} on ${b(name(worst.sel))}'s turn: rho ${fmtTau(worst.r.rho)}.`]);
  // Perfect reads
  const perfect = reads.filter(x => x.r.rho >= 0.9999);
  if (perfect.length) out.push(["Perfect reads", perfect.map(x => `${b(name(x.g))} → ${b(name(x.sel))}`).join(", ")]);

    if (!h.guesses) return; const byId = Object.fromEntries(h.items.map(i => [i.id, i.text])); const n = h.answer.length;

    Object.entries(h.guesses).forEach(([g, ord]) => { if (!Array.isArray(ord)) return; const pos = ord.indexOf(top); if (pos > 0 && (!upset || pos > upset.pos)) upset = { g, sel: h.selector, text: byId[top], pos, n }; });

    if (hard.err > easy.err) out.push(["Most misjudged thing", `${q(hard.text)}, ${b(name(hard.sel))}'s #${hard.k + 1}, readings were off by ${hard.err.toFixed(1)} spots on average.`]);

    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) { const key = [gs[i][0], gs[j][0]].sort().join("|"); const r = scoreGuess(gs[i][1], gs[j][1]).rho; (pairs[key] = pairs[key] || []).push(r); } });

  if (pk.length) { const [x, y] = pk[0].k.split("|"); out.push(["Great minds think alike", `${b(name(x))} and ${b(name(y))} read minds most alike (rho ${fmtTau(pk[0].avg)} with each other).`]); }
  if (pk.length > 1) { const [x, y] = pk[pk.length - 1].k.split("|"); if (pk[pk.length - 1].avg < pk[0].avg) out.push(["Never agree", `${b(name(x))} and ${b(name(y))} read minds least alike (rho ${fmtTau(pk[pk.length - 1].avg)}).`]); }

// Personal insights for whoever is looking at this phone.
function myInsights() {

  const out = []; const b = t => `<b>${esc(t)}</b>`; const id = me.id;

    Object.entries(h.guesses).forEach(([g, ord]) => { if (g === id || !Array.isArray(ord)) return; (sim[g] = sim[g] || []).push(scoreGuess(mine, ord).rho); }); });
  const simL = Object.entries(sim).map(([g, v]) => ({ g, a: avg(v) })).sort((x, y) => y.a - x.a);
  if (simL.length) out.push(["You think most like", `${b(name(simL[0].g))}: your readings matched each other at rho ${fmtTau(simL[0].a)}.`]);

  // Who read your mind
  const myTurn = H.find(h => h.selector === id);
  if (myTurn) {

    out.push(["Who read your mind best", `${b(name(rs[0][0]))}: rho ${fmtTau(rs[0][1].rho)}, ${rs[0][1].exact} spot on.`]);
    if (rs.length > 1 && rs[rs.length - 1][1].rho < rs[0][1].rho) out.push(["Who read your mind worst", `${b(name(rs[rs.length - 1][0]))}: rho ${fmtTau(rs[rs.length - 1][1].rho)}.`]);

    let filled = 0; local.items = local.items.map(x => (x && x.trim()) ? x : (pool.length ? (filled++, pool.pop()) : x));
    saveLocal(); render(); toast(filled ? `Filled ${filled} empty spot${filled > 1 ? "s" : ""}` : "No empty spots to fill"); return;
  }
  if (b.dataset.kick) { send({ type: "kick", id: b.dataset.kick }); return; }
  if (b.dataset.pick) { const k = turnKey(state); local.ranks = local.ranks || {}; const m = local.ranks[k] = local.ranks[k] || []; if (!m.includes(b.dataset.pick)) m.push(b.dataset.pick); saveLocal(); render(); return; }
  if (b.dataset.unpick) { const k = turnKey(state); const m = local.ranks[k] || []; local.ranks[k] = m.filter(x => x !== b.dataset.unpick); saveLocal(); render(); return; }
  const act = b.dataset.act; if (!act) return;
  switch (act) {
    case "create": {
      const n = $("#nm").value.trim(); if (!n) { $("#nm").focus(); toast("Add your name first"); return; }
      me.name = n.slice(0, 24); store.set("rmr:profile", me);
      b.disabled = true; b.textContent = "Setting up your room…";
      room = await pickFreeCode(); local = { creating: true }; saveLocal();
      history.replaceState(null, "", "#" + room);
      state = newState(); gotState = true; render(); connect(); publishState(); break;
    }
    case "joincode": {
      const c = ($("#joincode").value || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.length < 3) { toast("Enter the room code"); return; }
      const n = $("#nm") && $("#nm").value.trim(); if (n) { me.name = n.slice(0, 24); store.set("rmr:profile", me); }
      location.hash = c; location.reload(); break;
    }
    case "setname": { const n = $("#nm").value.trim(); if (!n) { toast("Add your name"); return; } me.name = n.slice(0, 24); store.set("rmr:profile", me); render(); syncMine(); break; }
    case "retry": location.reload(); break;
    case "home": location.hash = ""; location.reload(); break;
    case "copylink": {
      const link = roomLink();
      try { if (navigator.share && matchMedia("(pointer:coarse)").matches) { await navigator.share({ title: "Gideon’s Mind Reading Game", text: "Join my game, room " + room, url: link }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch { prompt("Copy this link", link); }
      break;
    }
    case "advance": send({ type: "advance", from_phase: state.phase, key: state.phase === "rank" || state.phase === "reveal" ? turnKey(state) : undefined }); break;
    case "submititems": {
      const items = local.items.slice(0, state.n).map(x => (x || "").trim());
      if (!items.every(Boolean)) return;
      local.itemsSubmitted = state.game; saveLocal(); send({ type: "items", items }); render(); break;
    }
    case "edititems": local.itemsSubmitted = 0; saveLocal(); render(); break;
    case "lock": { const k = turnKey(state); local.locked = k; saveLocal(); send({ type: "rank", key: k, order: local.ranks[k] }); render(); break; }
    case "unlock": local.locked = null; saveLocal(); render(); break;
    case "takehost": {
      if (!state) return; const s = clone(state); s.hostId = me.id; commit(s); toast("You're the host now"); break;
    }
    case "rejoin": local.kicked = false; saveLocal(); syncMine(); break;
    case "leave": location.hash = ""; location.reload(); break;
  }
});
// Detect being kicked: we were in the room, now we're not.
let wasIn = false;
const _render = render;
render = function () { if (state) { const inRoom = state.players.some(p => p.id === me.id); if (wasIn && !inRoom) { local.kicked = true; saveLocal(); } wasIn = inRoom; } _render(); };
window.addEventListener("hashchange", () => location.reload());

render();
if (room) connect();
})();
</script>
</body>
</html>
